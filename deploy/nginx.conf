# ResearchConclave — optional Nginx reverse proxy
#
# Lets you serve on port 80/443 (so users don't type :8501) and add HTTPS.
#
# Install:
#   sudo apt-get install -y nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/researchconclave
#   sudo ln -sf /etc/nginx/sites-available/researchconclave /etc/nginx/sites-enabled/researchconclave
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (needs a domain pointing at your EC2 IP):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com    # auto-edits this file + auto-renews

server {
    listen 80;
    server_name _;   # or your-domain.com

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit uses websockets for live updates — these two headers are required.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived websocket connections.
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
